[project]
name = "chalkolate-backend"
version = "0.1.0"
description = "Stateless lecture board snapshot analysis backend for Chalkolate"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio>=4.0,<5",
    "fastapi>=0.115.0,<1.0.0",
    "google-genai>=1.10.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "numpy>=2.1.0,<3.0.0",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
    "pillow>=13.0.0,<14.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "server"
files = ["server"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
